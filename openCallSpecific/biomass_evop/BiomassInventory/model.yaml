BiomassInventory:

  description: CIRCULOOS data model for the calculated stock position of a biomass material in the EVOP value chain, covering physical, free, reserved and safely available quantities together with the safety margin and offer percentages applied.

  properties:

    advertisedQuantityKg:
      allOf:
        - additionalProperties: no
          anyOf:
            - required:
                - value
            - required:
                - minValue
            - required:
                - maxValue
          properties:
            maxValue:
              description: Upper bound of the value, when the source declares a range or a maximum.
              type: number
            minValue:
              description: Lower bound of the value, when the source declares a range or a minimum.
              type: number
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Property
              type: string
            unitCode:
              description: Unit of measurement of the value, given as a UN/CEFACT code where one exists.
              type: string
            value:
              description: Exact measured value, when a single figure is known.
              type: number
          required:
            - type
            - unitCode
          type: object
      description: 'Expected unitCode: KGM. Quantity of biomass from the inventory currently advertised or made available to other users.'
      x-ngsi:
        type: Property

    calculatedAt:
      allOf:
        - additionalProperties: no
          properties:
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Property
              type: string
            value:
              format: date-time
              pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$
              type: string
          required:
            - type
            - value
          type: object
      description: Date and time when the inventory values were last calculated or updated.
      x-ngsi:
        type: Property

    freeStockKg:
      allOf:
        - additionalProperties: no
          anyOf:
            - required:
                - value
            - required:
                - minValue
            - required:
                - maxValue
          properties:
            maxValue:
              description: Upper bound of the value, when the source declares a range or a maximum.
              type: number
            minValue:
              description: Lower bound of the value, when the source declares a range or a minimum.
              type: number
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Property
              type: string
            unitCode:
              description: Unit of measurement of the value, given as a UN/CEFACT code where one exists.
              type: string
            value:
              description: Exact measured value, when a single figure is known.
              type: number
          required:
            - type
            - unitCode
          type: object
      description: 'Expected unitCode: KGM. Quantity of biomass available after accounting for quantities already committed or reserved.'
      x-ngsi:
        type: Property

    id:
      description: Unique entity identifier, with the format urn:ngsi-ld:evop:biomass-inventory:<material>.
      type: string
      x-ngsi:
        type: Property

    material:
      allOf:
        - additionalProperties: no
          properties:
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Property
              type: string
            value:
              type: string
          required:
            - type
            - value
          type: object
      description: Identifies the biomass material represented in the inventory, such as olive pits.
      x-ngsi:
        type: Property

    movementCount:
      allOf:
        - additionalProperties: no
          properties:
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Property
              type: string
            unitCode:
              type: string
            value:
              type: number
          required:
            - type
            - value
          type: object
      description: Dimensionless. Number of stock movements recorded for the corresponding biomass inventory.
      x-ngsi:
        type: Property

    offerPercentage:
      allOf:
        - additionalProperties: no
          anyOf:
            - required:
                - value
            - required:
                - minValue
            - required:
                - maxValue
          properties:
            maxValue:
              description: Upper bound of the value, when the source declares a range or a maximum.
              type: number
            minValue:
              description: Lower bound of the value, when the source declares a range or a minimum.
              type: number
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Property
              type: string
            unitCode:
              description: Unit of measurement of the value, given as a UN/CEFACT code where one exists.
              type: string
            value:
              description: Exact measured value, when a single figure is known.
              type: number
          required:
            - type
            - unitCode
          type: object
      description: 'Expected unitCode: P1. Percentage of the available inventory intended to be offered to other users.'
      x-ngsi:
        type: Property

    physicalStockKg:
      allOf:
        - additionalProperties: no
          anyOf:
            - required:
                - value
            - required:
                - minValue
            - required:
                - maxValue
          properties:
            maxValue:
              description: Upper bound of the value, when the source declares a range or a maximum.
              type: number
            minValue:
              description: Lower bound of the value, when the source declares a range or a minimum.
              type: number
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Property
              type: string
            unitCode:
              description: Unit of measurement of the value, given as a UN/CEFACT code where one exists.
              type: string
            value:
              description: Exact measured value, when a single figure is known.
              type: number
          required:
            - type
            - unitCode
          type: object
      description: 'Expected unitCode: KGM. Total physical quantity of the biomass currently recorded in stock.'
      x-ngsi:
        type: Property

    reserveKg:
      allOf:
        - additionalProperties: no
          anyOf:
            - required:
                - value
            - required:
                - minValue
            - required:
                - maxValue
          properties:
            maxValue:
              description: Upper bound of the value, when the source declares a range or a maximum.
              type: number
            minValue:
              description: Lower bound of the value, when the source declares a range or a minimum.
              type: number
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Property
              type: string
            unitCode:
              description: Unit of measurement of the value, given as a UN/CEFACT code where one exists.
              type: string
            value:
              description: Exact measured value, when a single figure is known.
              type: number
          required:
            - type
            - unitCode
          type: object
      description: 'Expected unitCode: KGM. Quantity of biomass reserved and therefore excluded from the freely available stock.'
      x-ngsi:
        type: Property

    safeAvailableKg:
      allOf:
        - additionalProperties: no
          anyOf:
            - required:
                - value
            - required:
                - minValue
            - required:
                - maxValue
          properties:
            maxValue:
              description: Upper bound of the value, when the source declares a range or a maximum.
              type: number
            minValue:
              description: Lower bound of the value, when the source declares a range or a minimum.
              type: number
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Property
              type: string
            unitCode:
              description: Unit of measurement of the value, given as a UN/CEFACT code where one exists.
              type: string
            value:
              description: Exact measured value, when a single figure is known.
              type: number
          required:
            - type
            - unitCode
          type: object
      description: 'Expected unitCode: KGM. Quantity of biomass considered safely available for offering or use after applying the defined safety margin.'
      x-ngsi:
        type: Property

    safetyMarginPercent:
      allOf:
        - additionalProperties: no
          anyOf:
            - required:
                - value
            - required:
                - minValue
            - required:
                - maxValue
          properties:
            maxValue:
              description: Upper bound of the value, when the source declares a range or a maximum.
              type: number
            minValue:
              description: Lower bound of the value, when the source declares a range or a minimum.
              type: number
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Property
              type: string
            unitCode:
              description: Unit of measurement of the value, given as a UN/CEFACT code where one exists.
              type: string
            value:
              description: Exact measured value, when a single figure is known.
              type: number
          required:
            - type
            - unitCode
          type: object
      description: 'Expected unitCode: P1. Percentage of inventory retained as a safety margin to avoid committing the full physical stock.'
      x-ngsi:
        type: Property

    type:
      description: NGSI Entity type. It has to be BiomassInventory
      enum:
        - BiomassInventory
      type: string
      x-ngsi:
        type: Property

  required:
    - id
    - type
    - material
    - physicalStockKg
    - calculatedAt

  type: object

