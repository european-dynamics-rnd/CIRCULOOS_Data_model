MaterialOffer:

  description: CIRCULOOS data model for an offer of surplus biomass made available to other organisations in the EVOP circular supply chain, covering the quantity offered, the safety margin retained and the inventory the offer derives from.

  properties:

    availableForOthers:
      allOf:
        - additionalProperties: no
          properties:
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Property
              type: string
            value:
              type: boolean
          required:
            - type
            - value
          type: object
      description: Indicates whether the material is available for use or purchase by other organisations through the circular supply chain.
      x-ngsi:
        type: Property

    availableQuantityKg:
      allOf:
        - additionalProperties: no
          anyOf:
            - required:
                - value
            - required:
                - minValue
            - required:
                - maxValue
          properties:
            maxValue:
              description: Upper bound of the value, when the source declares a range or a maximum.
              type: number
            minValue:
              description: Lower bound of the value, when the source declares a range or a minimum.
              type: number
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Property
              type: string
            unitCode:
              description: Unit of measurement of the value, given as a UN/CEFACT code where one exists.
              type: string
            value:
              description: Exact measured value, when a single figure is known.
              type: number
          required:
            - type
            - unitCode
          type: object
      description: 'Expected unitCode: KGM. Quantity of the material currently available for other users.'
      x-ngsi:
        type: Property

    id:
      description: Unique entity identifier, with the format urn:ngsi-ld:evop:material-offer:<material>.
      type: string
      x-ngsi:
        type: Property

    material:
      allOf:
        - additionalProperties: no
          properties:
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Property
              type: string
            value:
              type: string
          required:
            - type
            - value
          type: object
      description: Identifies the biomass material being offered, such as olive pits.
      x-ngsi:
        type: Property

    offerPercentage:
      allOf:
        - additionalProperties: no
          anyOf:
            - required:
                - value
            - required:
                - minValue
            - required:
                - maxValue
          properties:
            maxValue:
              description: Upper bound of the value, when the source declares a range or a maximum.
              type: number
            minValue:
              description: Lower bound of the value, when the source declares a range or a minimum.
              type: number
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Property
              type: string
            unitCode:
              description: Unit of measurement of the value, given as a UN/CEFACT code where one exists.
              type: string
            value:
              description: Exact measured value, when a single figure is known.
              type: number
          required:
            - type
            - unitCode
          type: object
      description: 'Expected unitCode: P1. Percentage of the available inventory quantity that is intended to be offered to other users.'
      x-ngsi:
        type: Property

    quantityUnit:
      allOf:
        - additionalProperties: no
          properties:
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Property
              type: string
            value:
              type: string
          required:
            - type
            - value
          type: object
      description: Unit used to express the available material quantity, e.g. kg.
      x-ngsi:
        type: Property

    safetyMarginPercent:
      allOf:
        - additionalProperties: no
          anyOf:
            - required:
                - value
            - required:
                - minValue
            - required:
                - maxValue
          properties:
            maxValue:
              description: Upper bound of the value, when the source declares a range or a maximum.
              type: number
            minValue:
              description: Lower bound of the value, when the source declares a range or a minimum.
              type: number
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Property
              type: string
            unitCode:
              description: Unit of measurement of the value, given as a UN/CEFACT code where one exists.
              type: string
            value:
              description: Exact measured value, when a single figure is known.
              type: number
          required:
            - type
            - unitCode
          type: object
      description: 'Expected unitCode: P1. Percentage of stock reserved as a safety margin and therefore not intended to be offered.'
      x-ngsi:
        type: Property

    sourceInventory:
      allOf:
        - additionalProperties: no
          properties:
            object:
              description: URN of the referenced entity.
              pattern: ^urn:ngsi-ld:.+$
              type: string
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Relationship
              type: string
          required:
            - type
            - object
          type: object
      description: Identifier of the inventory record from which the material offer quantity is derived.
      x-ngsi:
        type: Relationship

    status:
      allOf:
        - additionalProperties: no
          properties:
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Property
              type: string
            value:
              type: string
          required:
            - type
            - value
          type: object
      description: Current status of the material offer, indicating whether it is available or otherwise unavailable.
      x-ngsi:
        type: Property

    type:
      description: NGSI Entity type. It has to be MaterialOffer
      enum:
        - MaterialOffer
      type: string
      x-ngsi:
        type: Property

    updatedAt:
      allOf:
        - additionalProperties: no
          properties:
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Property
              type: string
            value:
              format: date-time
              pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$
              type: string
          required:
            - type
            - value
          type: object
      description: Date and time when the material offer information was last updated.
      x-ngsi:
        type: Property

  required:
    - id
    - type
    - material
    - availableForOthers
    - status

  type: object

  x-derived-from: ''

