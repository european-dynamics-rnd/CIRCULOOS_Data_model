              type: string
            value:
              description: Exact measured value, when a single figure is known.
              type: number
          required:
            - type
            - unitCode
          type: object
      description: 'Expected unitCode: CEL. Temperature of the surrounding air measured during the boiler test.'
      x-ngsi:
        type: Property

    ashPercent:
