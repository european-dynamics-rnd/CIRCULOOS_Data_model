MortarBatch:

  description: CIRCULOOS data model for a single production batch of a Biocorner bio-based mortar, providing full traceability from the finished batch back to its product, recipe, manufacturing process, producer and secondary raw material batches.

  properties:

    batchCode:
      allOf:
        - additionalProperties: no
          properties:
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Property
              type: string
            value:
              type: string
          required:
            - type
            - value
          type: object
      description: Internal production batch identifier assigned by the manufacturer for traceability. Follows a structured naming convention including product code, year, and sequence number.
      x-ngsi:
        type: Property

    dateCreated:
      allOf:
        - additionalProperties: no
          properties:
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Property
              type: string
            value:
              format: date
              pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
              type: string
          required:
            - type
            - value
          type: object
      description: Date at which the entity was created.
      x-ngsi:
        type: Property

    description:
      allOf:
        - additionalProperties: no
          properties:
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Property
              type: string
            value:
              type: string
          required:
            - type
            - value
          type: object
      description: Free-text description of the production batch including production scale, total quantity produced, and any notable quality observations.
      x-ngsi:
        type: Property

    id:
      description: Unique entity identifier, with the format urn:ngsi-ld:MortarBatch:<id>.
      type: string
      x-ngsi:
        type: Property

    instanceOf:
      allOf:
        - additionalProperties: no
          properties:
            object:
              description: URN of the referenced entity, with the format urn:ngsi-ld:<type>:<id>.
              pattern: ^urn:ngsi-ld:[A-Za-z0-9_]+:.+$
              type: string
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Relationship
              type: string
          required:
            - type
            - object
          type: object
      description: Relationship linking this production batch to its parent MortarProduct entity. Establishes which product line this specific batch belongs to.
      x-ngsi:
        type: Relationship

    producedBy:
      allOf:
        - additionalProperties: no
          properties:
            object:
              description: URN of the referenced entity, with the format urn:ngsi-ld:<type>:<id>.
              pattern: ^urn:ngsi-ld:[A-Za-z0-9_]+:.+$
              type: string
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Relationship
              type: string
          required:
            - type
            - object
          type: object
      description: Relationship to the Organization entity responsible for manufacturing this batch. Identifies the production facility and legal entity.
      x-ngsi:
        type: Relationship

    producedFromRecipe:
      allOf:
        - additionalProperties: no
          properties:
            object:
              description: URN of the referenced entity, with the format urn:ngsi-ld:<type>:<id>.
              pattern: ^urn:ngsi-ld:[A-Za-z0-9_]+:.+$
              type: string
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Relationship
              type: string
          required:
            - type
            - object
          type: object
      description: Relationship to the Recipe entity whose formulation was followed during production. Enables traceability from final product back to formulation specifications.
      x-ngsi:
        type: Relationship

    type:
      description: NGSI Entity type. It has to be MortarBatch
      enum:
        - MortarBatch
      type: string
      x-ngsi:
        type: Property

    usedProcess:
      allOf:
        - additionalProperties: no
          properties:
            object:
              description: URN of the referenced entity, with the format urn:ngsi-ld:<type>:<id>.
              pattern: ^urn:ngsi-ld:[A-Za-z0-9_]+:.+$
              type: string
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Relationship
              type: string
          required:
            - type
            - object
          type: object
      description: Relationship to the Process entity describing the manufacturing procedure applied. Links the batch to specific energy, water, and waste generation data.
      x-ngsi:
        type: Relationship

    usedSRMBatches1:
      allOf:
        - additionalProperties: no
          properties:
            object:
              description: URN of the referenced entity, with the format urn:ngsi-ld:<type>:<id>.
              pattern: ^urn:ngsi-ld:[A-Za-z0-9_]+:.+$
              type: string
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Relationship
              type: string
          required:
            - type
            - object
          type: object
      description: Relationship to the first SRMBatch entity used as input material. Enables full upstream traceability to raw material origin and supplier.
      x-ngsi:
        type: Relationship

    usedSRMBatches2:
      allOf:
        - additionalProperties: no
          properties:
            object:
              description: URN of the referenced entity, with the format urn:ngsi-ld:<type>:<id>.
              pattern: ^urn:ngsi-ld:[A-Za-z0-9_]+:.+$
              type: string
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Relationship
              type: string
          required:
            - type
            - object
          type: object
      description: Relationship to the second SRMBatch entity used as input material, when the formulation requires multiple secondary raw materials.
      x-ngsi:
        type: Relationship

    usedSRMBatches3:
      allOf:
        - additionalProperties: no
          properties:
            object:
              description: URN of the referenced entity, with the format urn:ngsi-ld:<type>:<id>.
              pattern: ^urn:ngsi-ld:[A-Za-z0-9_]+:.+$
              type: string
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Relationship
              type: string
          required:
            - type
            - object
          type: object
      description: Relationship to the third SRMBatch entity used as input material, applicable for multi-component formulations.
      x-ngsi:
        type: Relationship

    usedSRMBatches4:
      allOf:
        - additionalProperties: no
          properties:
            object:
              description: URN of the referenced entity, with the format urn:ngsi-ld:<type>:<id>.
              pattern: ^urn:ngsi-ld:[A-Za-z0-9_]+:.+$
              type: string
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Relationship
              type: string
          required:
            - type
            - object
          type: object
      description: Relationship to the fourth SRMBatch entity used as input material, applicable for complex hybrid formulations.
      x-ngsi:
        type: Relationship

