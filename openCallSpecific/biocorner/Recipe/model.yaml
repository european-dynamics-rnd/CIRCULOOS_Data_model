Recipe:

  description: CIRCULOOS data model for a Biocorner bio-based mortar formulation, covering the secondary raw materials it combines, its mixing and curing parameters and the organization that developed it.

  properties:

    containsSRM:
      allOf:
        - anyOf:
            - description: URNs of the referenced entities, each with the format urn:ngsi-ld:<type>:<id>.
              items:
                pattern: ^urn:ngsi-ld:[A-Za-z0-9_]+:.+$
                type: string
              minItems: 1
              type: array
            - additionalProperties: no
              properties:
                object:
                  description: URNs of the referenced entities, each with the format urn:ngsi-ld:<type>:<id>.
                  items:
                    pattern: ^urn:ngsi-ld:[A-Za-z0-9_]+:.+$
                    type: string
                  minItems: 1
                  type: array
                observedAt:
                  format: date-time
                  type: string
                type:
                  enum:
                    - Relationship
                  type: string
              required:
                - type
                - object
              type: object
      description: SRM entities combined in this formulation, listed with the primary (main bio-based) secondary raw material first.
      x-ngsi:
        type: Relationship

    curingDuration:

      allOf:
        - anyOf:

            - anyOf:
                - description: Exact measured value, when a single figure is known.
                  type: number
                - additionalProperties: no
                  minProperties: 1
                  properties:
                    maxValue:
                      description: Upper bound of the value, when the source declares a range or a maximum.
                      type: number
                    minValue:
                      description: Lower bound of the value, when the source declares a range or a minimum.
                      type: number
                  type: object
              description: Exact value as a number, or a range as an object with minValue and/or maxValue.

            - additionalProperties: no
              properties:
                observedAt:
                  format: date-time
                  type: string
                type:
                  enum:
                    - Property
                  type: string
                unitCode:
                  description: UN/CEFACT code of the unit of measurement of the value.
                  type: string
                value:
                  anyOf:
                    - description: Exact measured value, when a single figure is known.
                      type: number
                    - additionalProperties: no
                      minProperties: 1
                      properties:
                        maxValue:
                          description: Upper bound of the value, when the source declares a range or a maximum.
                          type: number
                        minValue:
                          description: Lower bound of the value, when the source declares a range or a minimum.
                          type: number
                      type: object
                  description: Exact value as a number, or a range as an object with minValue and/or maxValue.
              required:
                - type
                - unitCode
                - value
              type: object

      description: 'Expected unitCode: DAY. Required curing period before the product reaches its declared performance characteristics under standard reference conditions.'

      x-ngsi:
        type: Property

    developedBy:
      allOf:
        - anyOf:
            - description: URN of the referenced entity, with the format urn:ngsi-ld:<type>:<id>.
              pattern: ^urn:ngsi-ld:[A-Za-z0-9_]+:.+$
              type: string
            - additionalProperties: no
              properties:
                object:
                  description: URN of the referenced entity, with the format urn:ngsi-ld:<type>:<id>.
                  pattern: ^urn:ngsi-ld:[A-Za-z0-9_]+:.+$
                  type: string
                observedAt:
                  format: date-time
                  type: string
                type:
                  enum:
                    - Relationship
                  type: string
              required:
                - type
                - object
              type: object
      description: Relationship to the Organization entity that developed and validated this formulation through laboratory testing and characterisation.
      x-ngsi:
        type: Relationship

    formulation:
      allOf:
        - anyOf:
            - type: string
            - additionalProperties: no
              properties:
                observedAt:
                  format: date-time
                  type: string
                type:
                  enum:
                    - Property
                  type: string
                value:
                  type: string
              required:
                - type
                - value
              type: object
      description: Quantitative composition summary listing each component with its percentage by weight, including both SRM components and conventional binders or additives.
      x-ngsi:
        type: Property

    id:
      description: Unique entity identifier, with the format urn:ngsi-ld:Recipe:<id>.
      type: string
      x-ngsi:
        type: Property

    mixingTime:

      allOf:
        - anyOf:

            - anyOf:
                - description: Exact measured value, when a single figure is known.
                  type: number
                - additionalProperties: no
                  minProperties: 1
                  properties:
                    maxValue:
                      description: Upper bound of the value, when the source declares a range or a maximum.
                      type: number
                    minValue:
                      description: Lower bound of the value, when the source declares a range or a minimum.
                      type: number
                  type: object
              description: Exact value as a number, or a range as an object with minValue and/or maxValue.

            - additionalProperties: no
              properties:
                observedAt:
                  format: date-time
                  type: string
                type:
                  enum:
                    - Property
                  type: string
                unitCode:
                  description: UN/CEFACT code of the unit of measurement of the value.
                  type: string
                value:
                  anyOf:
                    - description: Exact measured value, when a single figure is known.
                      type: number
                    - additionalProperties: no
                      minProperties: 1
                      properties:
                        maxValue:
                          description: Upper bound of the value, when the source declares a range or a maximum.
                          type: number
                        minValue:
                          description: Lower bound of the value, when the source declares a range or a minimum.
                          type: number
                      type: object
                  description: Exact value as a number, or a range as an object with minValue and/or maxValue.
              required:
                - type
                - unitCode
                - value
              type: object

      description: 'Expected unitCode: MIN. Total duration of the mixing process, from initial component blending to final homogeneous mixture ready for application or casting.'

      x-ngsi:
        type: Property

    name:
      allOf:
        - anyOf:
            - type: string
            - additionalProperties: no
              properties:
                observedAt:
                  format: date-time
                  type: string
                type:
                  enum:
                    - Property
                  type: string
                value:
                  type: string
              required:
                - type
                - value
              type: object
      description: Descriptive name of the recipe identifying the primary SRM and formulation variant for internal reference and traceability.
      x-ngsi:
        type: Property

    processingInstructions:
      allOf:
        - anyOf:
            - type: string
            - additionalProperties: no
              properties:
                observedAt:
                  format: date-time
                  type: string
                type:
                  enum:
                    - Property
                  type: string
                value:
                  type: string
              required:
                - type
                - value
              type: object
      description: Step-by-step manufacturing procedure including mixing parameters, component addition sequence, timing, and environmental conditions for production.
      x-ngsi:
        type: Property

    type:
      description: NGSI Entity type. It has to be Recipe
      enum:
        - Recipe
      type: string
      x-ngsi:
        type: Property

    waterBinderRatio:
      allOf:
        - anyOf:
            - type: number
            - additionalProperties: no
              properties:
                observedAt:
                  format: date-time
                  type: string
                type:
                  enum:
                    - Property
                  type: string
                unitCode:
                  type: string
                value:
                  type: number
              required:
                - type
                - value
              type: object
      description: Dimensionless. Mass ratio of water to binder content in the formulation. Critical parameter controlling workability, strength development, and porosity of the final product.
      x-ngsi:
        type: Property

  required:
    - id
    - type
    - name
    - formulation
    - developedBy
    - containsSRM

  type: object

