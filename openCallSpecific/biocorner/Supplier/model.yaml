Supplier:

  description: CIRCULOOS data model for a supplier facility or collection point delivering secondary raw materials to Biocorner mortar production, covering its location, contact details, transport mode and distance to the manufacturer.

  properties:

    address:
      allOf:
        - additionalProperties: no
          properties:
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Property
              type: string
            value:
              type: string
          required:
            - type
            - value
          type: object
      description: The mailing address of the supplier facility.
      x-ngsi:
        type: Property

    city:
      allOf:
        - additionalProperties: no
          properties:
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Property
              type: string
            value:
              type: string
          required:
            - type
            - value
          type: object
      description: The city in which the supplier facility is located.
      x-ngsi:
        type: Property

    contactEmail:
      allOf:
        - additionalProperties: no
          properties:
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Property
              type: string
            value:
              type: string
          required:
            - type
            - value
          type: object
      description: Email address of the primary contact person at the supplier facility. Used for supply chain communication and batch tracing inquiries.
      x-ngsi:
        type: Property

    contactPerson:
      allOf:
        - additionalProperties: no
          properties:
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Property
              type: string
            value:
              type: string
          required:
            - type
            - value
          type: object
      description: Name of the designated contact person responsible for material supply coordination at this facility.
      x-ngsi:
        type: Property

    country:
      allOf:
        - additionalProperties: no
          properties:
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Property
              type: string
            value:
              type: string
          required:
            - type
            - value
          type: object
      description: The country in which the supplier facility is located.
      x-ngsi:
        type: Property

    distanceToManufacturer:
      allOf:
        - additionalProperties: no
          anyOf:
            - required:
                - value
            - required:
                - minValue
            - required:
                - maxValue
          properties:
            maxValue:
              description: Upper bound of the value, when the source declares a range or a maximum.
              type: number
            minValue:
              description: Lower bound of the value, when the source declares a range or a minimum.
              type: number
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Property
              type: string
            unitCode:
              description: UN/CEFACT code of the unit of measurement of the value.
              type: string
            value:
              description: Exact measured value, when a single figure is known.
              type: number
          required:
            - type
            - unitCode
          type: object
      description: 'Expected unitCode: KMT. Road distance from the supplier facility to the manufacturer. Used for transport emission estimation and regional sourcing analysis.'
      x-ngsi:
        type: Property

    id:
      description: Unique entity identifier, with the format urn:ngsi-ld:Supplier:<id>.
      type: string
      x-ngsi:
        type: Property

    name:
      allOf:
        - additionalProperties: no
          properties:
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Property
              type: string
            value:
              type: string
          required:
            - type
            - value
          type: object
      description: Name of the supplier facility or collection point. May differ from the parent organization name when multiple supply facilities exist.
      x-ngsi:
        type: Property

    operatedBy:
      allOf:
        - additionalProperties: no
          properties:
            object:
              description: URN of the referenced entity, with the format urn:ngsi-ld:<type>:<id>.
              pattern: ^urn:ngsi-ld:[A-Za-z0-9_]+:.+$
              type: string
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Relationship
              type: string
          required:
            - type
            - object
          type: object
      description: Relationship to the Organization entity that operates this supplier facility.
      x-ngsi:
        type: Relationship

    postalCode:
      allOf:
        - additionalProperties: no
          properties:
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Property
              type: string
            value:
              type: string
          required:
            - type
            - value
          type: object
      description: The postal code of the supplier facility address.
      x-ngsi:
        type: Property

    region:
      allOf:
        - additionalProperties: no
          properties:
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Property
              type: string
            value:
              type: string
          required:
            - type
            - value
          type: object
      description: Administrative region where the supplier facility is located. Key parameter for regional circular economy indicators.
      x-ngsi:
        type: Property

    suppliesSRM1:
      allOf:
        - additionalProperties: no
          properties:
            object:
              description: URN of the referenced entity, with the format urn:ngsi-ld:<type>:<id>.
              pattern: ^urn:ngsi-ld:[A-Za-z0-9_]+:.+$
              type: string
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Relationship
              type: string
          required:
            - type
            - object
          type: object
      description: Relationship to the first SRM entity type supplied by this facility. Establishes which secondary raw materials originate from this point in the supply chain.
      x-ngsi:
        type: Relationship

    suppliesSRM2:
      allOf:
        - additionalProperties: no
          properties:
            object:
              description: URN of the referenced entity, with the format urn:ngsi-ld:<type>:<id>.
              pattern: ^urn:ngsi-ld:[A-Za-z0-9_]+:.+$
              type: string
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Relationship
              type: string
          required:
            - type
            - object
          type: object
      description: Relationship to the second SRM entity type supplied by this facility, when the supplier provides multiple material types.
      x-ngsi:
        type: Relationship

    transportationMode:
      allOf:
        - additionalProperties: no
          properties:
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Property
              type: string
            value:
              type: string
          required:
            - type
            - value
          type: object
      description: Primary transport method and vehicle type used for material delivery, including emission standard classification where applicable.
      x-ngsi:
        type: Property

    type:
      description: NGSI Entity type. It has to be Supplier
      enum:
        - Supplier
      type: string
      x-ngsi:
        type: Property

  required:
    - id
    - type
    - name
    - operatedBy
    - suppliesSRM1

  type: object

