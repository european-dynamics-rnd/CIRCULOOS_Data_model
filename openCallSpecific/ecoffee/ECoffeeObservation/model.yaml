      allOf:
        - additionalProperties: no
          properties:
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Property
              type: string
            unitCode:
              type: string
            value:
              type: number
          required:
            - type
            - value
          type: object
      description: 'Expected unitCode: GRM. Mass of aluminium packaging used per product or batch. It is used to quantify packaging material demand and related lifecycle impacts.'
      x-ngsi:
        type: Property

    areaServed:
