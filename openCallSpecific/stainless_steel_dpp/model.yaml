  x-license-url: https://github.com/smart-data-models/circuloos_data_model/blob/master/stainless_steels/LICENSE.md

  x-model-schema: https://raw.githubusercontent.com/TO_ADD_LATER/schema.json

  x-model-tags: ''

  x-version: 0.0.1
