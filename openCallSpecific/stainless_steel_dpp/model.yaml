stainless_steels:

  description: CIRCULOOS data model for the Digital Product Passport of a stainless steel product, covering product identification, production time window and the manufacturing route the product goes through.

  properties:

    address:
      description: The mailing address
      properties:
        addressCountry:
          description: Property. The country. For example, Spain. Model:'https://schema.org/addressCountry'
          type: string
        addressLocality:
          description: Property. The locality in which the street address is, and which is in the region. Model:'https://schema.org/addressLocality'
          type: string
        addressRegion:
          description: Property. The region in which the locality is, and which is in the country. Model:'https://schema.org/addressRegion'
          type: string
        district:
          description: Property. A district is a type of administrative division that, in some countries, is managed by the local government
          type: string
        postOfficeBoxNumber:
          description: Property. The post office box number for PO box addresses. For example, 03578. Model:'https://schema.org/postOfficeBoxNumber'
          type: string
        postalCode:
          description: Property. The postal code. For example, 24004. Model:'https://schema.org/https://schema.org/postalCode'
          type: string
        streetAddress:
          description: Property. The street address. Model:'https://schema.org/streetAddress'
          type: string
        streetNr:
          description: Property. Number identifying a specific property on a public street
          type: string
      type: object
      x-ngsi:
        model: https://schema.org/address
        type: Property

    alternateName:
      description: An alternative name for this item
      type: string
      x-ngsi:
        type: Property

    areaServed:
      description: The geographic area where a service or offered item is provided
      type: string
      x-ngsi:
        model: https://schema.org/Text
        type: Property

    dataProvider:
      description: A sequence of characters identifying the provider of the harmonised data entity
      type: string
      x-ngsi:
        type: Property

    dateCreated:
      description: Entity creation timestamp. This will usually be allocated by the storage platform
      format: date-time
      type: string
      x-ngsi:
        type: Property

    dateModified:
      description: Timestamp of the last modification of the entity. This will usually be allocated by the storage platform
      format: date-time
      type: string
      x-ngsi:
        type: Property

    description:
      description: A description of this item
      type: string
      x-ngsi:
        type: Property

    dppId:
      allOf:
        - additionalProperties: no
          properties:
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Property
              type: string
            value:
              type: string
          required:
            - type
            - value
          type: object
      description: Unique UUID of the Digital Product Passport of this product.
      x-ngsi:
        type: Property

    endTime:
      allOf:
        - additionalProperties: no
          properties:
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Property
              type: string
            unitCode:
              type: string
            value:
              description: Property. Unix epoch timestamp in seconds.
              type: number
          required:
            - type
            - value
          type: object
      description: End time of the Digital Product Passport, as a Unix epoch timestamp in seconds.
      x-ngsi:
        type: Property

    factoryInternalBarcode:
      allOf:
        - additionalProperties: no
          properties:
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Property
              type: string
            value:
              type: string
          required:
            - type
            - value
          type: object
      description: Product unique identifier (barcode) assigned at the factory.
      x-ngsi:
        type: Property

    id:
      description: Unique entity identifier, with the format urn:ngsi-ld:<type>:<uuid>.
      type: string
      x-ngsi:
        type: Property

    location:

      description: GeoProperty. Geojson reference to the item. It can be Point, LineString, Polygon, MultiPoint, MultiLineString or MultiPolygon

      oneOf:

        - description: GeoProperty. Geojson reference to the item. Point
          properties:
            bbox:
              description: Property. BBox of the  Point
              items:
                type: number
              minItems: 4
              type: array
            coordinates:
              description: Property. Coordinates of the Point
              items:
                type: number
              minItems: 2
              type: array
            type:
              enum:
                - Point
              type: string
          required:
            - type
            - coordinates
          title: GeoJSON Point
          type: object

        - description: GeoProperty. Geojson reference to the item. LineString
          properties:
            bbox:
              description: Property. BBox coordinates of the LineString
              items:
                type: number
              minItems: 4
              type: array
            coordinates:
              description: Property. Coordinates of the LineString
              items:
                items:
                  type: number
                minItems: 2
                type: array
              minItems: 2
              type: array
            type:
              enum:
                - LineString
              type: string
          required:
            - type
            - coordinates
          title: GeoJSON LineString
          type: object

        - description: GeoProperty. Geojson reference to the item. Polygon
          properties:
            bbox:
              description: Property. BBox coordinates of the Polygon
              items:
                type: number
              minItems: 4
              type: array
            coordinates:
              description: Property. Coordinates of the Polygon
              items:
                items:
                  items:
                    type: number
                  minItems: 2
                  type: array
                minItems: 4
                type: array
              type: array
            type:
              enum:
                - Polygon
              type: string
          required:
            - type
            - coordinates
          title: GeoJSON Polygon
          type: object

        - description: GeoProperty. Geojson reference to the item. MultiPoint
          properties:
            bbox:
              description: Property. BBox coordinates of the LineString
              items:
                type: number
              minItems: 4
              type: array
            coordinates:
              description: Property. Coordinates of the MulitPoint
              items:
                items:
                  type: number
                minItems: 2
                type: array
              type: array
            type:
              enum:
                - MultiPoint
              type: string
          required:
            - type
            - coordinates
          title: GeoJSON MultiPoint
          type: object

        - description: GeoProperty. Geojson reference to the item. MultiLineString
          properties:
            bbox:
              description: Property. BBox coordinates of the LineString
              items:
                type: number
              minItems: 4
              type: array
            coordinates:
              description: Property. Coordinates of the MultiLineString
              items:
                items:
                  items:
                    type: number
                  minItems: 2
                  type: array
                minItems: 2
                type: array
              type: array
            type:
              enum:
                - MultiLineString
              type: string
          required:
            - type
            - coordinates
          title: GeoJSON MultiLineString
          type: object

        - description: GeoProperty. Geojson reference to the item. MultiLineString
          properties:
            bbox:
              items:
                type: number
              minItems: 4
              type: array
            coordinates:
              description: Property. Coordinates of the MultiPolygon
              items:
                items:
                  items:
                    items:
                      type: number
                    minItems: 2
                    type: array
                  minItems: 4
                  type: array
                type: array
              type: array
            type:
              enum:
                - MultiPolygon
              type: string
          required:
            - type
            - coordinates
          title: GeoJSON MultiPolygon
          type: object

    name:
      description: The name of this item
      type: string
      x-ngsi:
        type: Property

    owner:
      description: A List containing a JSON encoded sequence of characters referencing the unique Ids of the owner(s)
      items:
        anyOf:
          - description: Property. Identifier format of any NGSI entity
            maxLength: 256
            minLength: 1
            pattern: ^[\w\-\.\{\}\$\+\*\[\]`|~^@!,:\\]+$
            type: string
          - description: Property. Identifier format of any NGSI entity
            format: uri
            type: string
        description: Relationship. Unique identifier of the entity
      type: array
      x-ngsi:
        type: Property

    productName:
      allOf:
        - additionalProperties: no
          properties:
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Property
              type: string
            value:
              type: string
          required:
            - type
            - value
          type: object
      description: Commercial product name.
      x-ngsi:
        type: Property

    route:

      allOf:
        - additionalProperties: no
          properties:

            observedAt:
              format: date-time
              type: string

            type:
              enum:
                - Property
              type: string

            value:
              description: Property. Ordered list of the manufacturing operations the product goes through.
              items:
                additionalProperties: no
                properties:
                  date:
                    description: Property. Unix epoch timestamp in seconds at which the operation was performed.
                    type: number
                  energyConsumption:
                    additionalProperties: no
                    description: Property. Energy consumed for this route step.
                    properties:
                      unit:
                        description: Property. Unit of measurement of the consumed energy, for example Wh.
                        type: string
                      value:
                        description: Property. Energy consumed by this route step.
                        minimum: 0
                        type: number
                    required:
                      - value
                      - unit
                    type: object
                  operation:
                    description: Property. Name of the manufacturing operation performed in this route step, for example Plastic Injection Molding, Metal Cutting or Assembly.
                    type: string
                  productionStatus:
                    description: Property. Outcome of the operation as reported by the production line, for example OK.
                    type: string
                required:
                  - operation
                  - date
                  - productionStatus
                type: object
              minItems: 1
              type: array

          required:
            - type
            - value
          type: object

      description: The processes the product goes through, each with its operation name, date, production status and energy consumption.

      x-ngsi:
        type: Property

    seeAlso:
      description: list of uri pointing to additional resources about the item
      oneOf:
        - items:
            format: uri
            type: string
          minItems: 1
          type: array
        - format: uri
          type: string
      x-ngsi:
        type: Property

    source:
      description: A sequence of characters giving the original source of the entity data as a URL. Recommended to be the fully qualified domain name of the source provider, or the URL to the source object
      type: string
      x-ngsi:
        type: Property

    startTime:
      allOf:
        - additionalProperties: no
          properties:
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Property
              type: string
            unitCode:
              type: string
            value:
              description: Property. Unix epoch timestamp in seconds.
              type: number
          required:
            - type
            - value
          type: object
      description: Start time of the Digital Product Passport, as a Unix epoch timestamp in seconds.
      x-ngsi:
        type: Property

    type:
      description: NGSI Entity type. It has to be stainless_steels
      enum:
        - stainless_steels
      type: string
      x-ngsi:
        type: Property

  required:
    - id
    - type
    - dppId
    - factoryInternalBarcode
    - productName
    - startTime
    - route

  type: object

  x-derived-from: ''

