MaterialRecord:

  description: CIRCULOOS data model for a single record in the ShineAgain data log, describing either a processing step (e.g. Shredding, Sorting, Pressing, CNC milling) or a transport operation performed on a material in a recycling loop, including mass in/out, energy use, locations and the partner that performed the step.

  properties:

    Date:
      allOf:
        - additionalProperties: no
          properties:
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Property
              type: string
            value:
              format: date
              pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
              type: string
          required:
            - type
            - value
          type: object
      description: Date on which the process step or transport took place.
      x-ngsi:
        type: Property

    End_location:
      allOf:
        - additionalProperties: no
          properties:
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Property
              type: string
            value:
              type: string
          required:
            - type
            - value
          type: object
      description: Location where the material ends up after the step. Mainly used for transport records; usually empty for on-site processing steps.
      x-ngsi:
        type: Property

    Energy_use_kWh:
      allOf:
        - additionalProperties: no
          anyOf:
            - required:
                - value
            - required:
                - minValue
            - required:
                - maxValue
          properties:
            maxValue:
              description: Upper bound of the value, when the source declares a range or a maximum.
              type: number
            minValue:
              description: Lower bound of the value, when the source declares a range or a minimum.
              type: number
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Property
              type: string
            unitCode:
              description: UN/CEFACT code of the unit of measurement of the value.
              type: string
            value:
              description: Exact measured value, when a single figure is known.
              type: number
          required:
            - type
            - unitCode
          type: object
      description: 'Expected unitCode: KWH. Electricity used by the machine(s) during this process step, as measured with an energy meter. If multiple machines are used the value is the calculated total of the measured values. Empty if not measured.'
      x-ngsi:
        type: Property

    KM:
      allOf:
        - additionalProperties: no
          anyOf:
            - required:
                - value
            - required:
                - minValue
            - required:
                - maxValue
          properties:
            maxValue:
              description: Upper bound of the value, when the source declares a range or a maximum.
              type: number
            minValue:
              description: Lower bound of the value, when the source declares a range or a minimum.
              type: number
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Property
              type: string
            unitCode:
              description: UN/CEFACT code of the unit of measurement of the value.
              type: string
            value:
              description: Exact measured value, when a single figure is known.
              type: number
          required:
            - type
            - unitCode
          type: object
      description: 'Expected unitCode: KMT. Distance travelled in kilometres. Only used for transport records; empty for processing steps.'
      x-ngsi:
        type: Property

    Material_Loop:
      allOf:
        - additionalProperties: no
          anyOf:
            - required:
                - value
            - required:
                - minValue
            - required:
                - maxValue
          properties:
            maxValue:
              description: Upper bound of the value, when the source declares a range or a maximum.
              type: number
            minValue:
              description: Lower bound of the value, when the source declares a range or a minimum.
              type: number
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Property
              type: string
            unitCode:
              description: UN/CEFACT code of the unit of measurement of the value.
              type: string
            value:
              description: Exact measured value, when a single figure is known.
              type: number
          required:
            - type
            - unitCode
          type: object
      description: 'Expected unitCode: C62 (unit). Number of the material loop (recycling cycle) the record belongs to, so the same material can be followed through successive reuse cycles; 1 is the first loop.'
      x-ngsi:
        type: Property

    Material_in_kg:
      allOf:
        - additionalProperties: no
          anyOf:
            - required:
                - value
            - required:
                - minValue
            - required:
                - maxValue
          properties:
            maxValue:
              description: Upper bound of the value, when the source declares a range or a maximum.
              type: number
            minValue:
              description: Lower bound of the value, when the source declares a range or a minimum.
              type: number
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Property
              type: string
            unitCode:
              description: UN/CEFACT code of the unit of measurement of the value.
              type: string
            value:
              description: Exact measured value, when a single figure is known.
              type: number
          required:
            - type
            - unitCode
          type: object
      description: 'Expected unitCode: KGM. Mass of material going into this step, in kilograms, as weighed before the step.'
      x-ngsi:
        type: Property

    Material_out_kg:
      allOf:
        - additionalProperties: no
          anyOf:
            - required:
                - value
            - required:
                - minValue
            - required:
                - maxValue
          properties:
            maxValue:
              description: Upper bound of the value, when the source declares a range or a maximum.
              type: number
            minValue:
              description: Lower bound of the value, when the source declares a range or a minimum.
              type: number
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Property
              type: string
            unitCode:
              description: UN/CEFACT code of the unit of measurement of the value.
              type: string
            value:
              description: Exact measured value, when a single figure is known.
              type: number
          required:
            - type
            - unitCode
          type: object
      description: 'Expected unitCode: KGM. Mass of material coming out of this step, in kilograms, as weighed afterwards. The difference with Material_in_kg is the loss or waste of this step.'
      x-ngsi:
        type: Property

    Notes:
      allOf:
        - additionalProperties: no
          properties:
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Property
              type: string
            value:
              type: string
          required:
            - type
            - value
          type: object
      description: Free-text remarks on the record, e.g. settings used, issues encountered etc.
      x-ngsi:
        type: Property

    Partner:
      allOf:
        - additionalProperties: no
          properties:
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Property
              type: string
            value:
              type: string
          required:
            - type
            - value
          type: object
      description: ShineAgain partner (or external supplier) that performed this step, e.g. Better_Future_Factory, The_New_Raw or Vacumetal.
      x-ngsi:
        type: Property

    Proces_step:
      allOf:
        - additionalProperties: no
          properties:
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Property
              type: string
            value:
              type: string
          required:
            - type
            - value
          type: object
      description: Processing step this record describes, e.g. Shredding, Sorting, Pressing or CNC milling. Empty for transport records.
      x-ngsi:
        type: Property

    Start_location:
      allOf:
        - additionalProperties: no
          properties:
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Property
              type: string
            value:
              type: string
          required:
            - type
            - value
          type: object
      description: For transport records, location where the transport starts.
      x-ngsi:
        type: Property

    Type_of_transport:
      allOf:
        - additionalProperties: no
          properties:
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Property
              type: string
            value:
              type: string
          required:
            - type
            - value
          type: object
      description: Vehicle used to move the material. Only used for transport records; empty for processing steps.
      x-ngsi:
        type: Property

    dateCreated:
      allOf:
        - additionalProperties: no
          properties:
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Property
              type: string
            value:
              format: date
              pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
              type: string
          required:
            - type
            - value
          type: object
      description: Date at which the entity was created.
      x-ngsi:
        type: Property

    id:
      description: Unique entity identifier, with the format urn:ngsi-ld:MaterialRecord:ShineAgain:<id>. The number follows the record numbering in the ShineAgain data log, so each process step or transport can be traced.
      type: string
      x-ngsi:
        type: Property

    type:
      description: NGSI Entity type. It has to be MaterialRecord
      enum:
        - MaterialRecord
      type: string
      x-ngsi:
        type: Property

  required:
    - id
    - type
    - Date

  type: object

  x-derived-from: ''

  x-disclaimer: Redistribution and use in source and binary forms, with or without modification, are permitted  provided that the license conditions are met. Copyleft (c) 2021 Contributors to Smart Data Models Program

  x-license-url: https://github.com/smart-data-models/circuloos_data_model/blob/master/MaterialRecord/LICENSE.md

  x-model-schema: https://raw.githubusercontent.com/TO_ADD_LATER/schema.json

  x-model-tags: ''

  x-version: 0.0.1
