  x-model-schema: https://raw.githubusercontent.com/european-dynamics-rnd/CIRCULOOS_Data_model/main/openCallSpecific/esp_islopol/RecyclingMaterialCollection/schema.json

  x-model-tags: esp_islopol

  x-version: 0.0.1
