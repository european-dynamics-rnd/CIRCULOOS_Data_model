ProductModel:

  description: CIRCULOOS data model for a product or material model that defines shared characteristics for individual Product records in the ISLOPOL value chain, covering its name, constituents, material, available categories and default unit of measurement.

  properties:

    availableCategories:
      allOf:
        - additionalProperties: no
          properties:
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Property
              type: string
            value:
              items:
                type: string
              minItems: 1
              type: array
          required:
            - type
            - value
          type: object
      description: List of product categories or grades available for the model. Simple hierarchies are allowed, e.g. 'Waste > EPS'.
      x-ngsi:
        type: Property

    constituents:
      allOf:
        - additionalProperties: no
          properties:
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Property
              type: string
            value:
              items:
                type: string
              minItems: 1
              type: array
          required:
            - type
            - value
          type: object
      description: Materials or components making up the product model.
      x-ngsi:
        type: Property

    description:
      allOf:
        - additionalProperties: no
          properties:
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Property
              type: string
            value:
              type: string
          required:
            - type
            - value
          type: object
      description: Human-readable description of the product or material represented by the model.
      x-ngsi:
        type: Property

    id:
      description: ''
      type: string
      x-ngsi:
        model: Unique entity identifier, with the format urn:ngsi-ld:Product<modelId>.
        type: Property

    material:
      allOf:
        - additionalProperties: no
          properties:
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Property
              type: string
            value:
              type: string
          required:
            - type
            - value
          type: object
      description: Main material or composition associated with the product model. Given in the source as https://schema.org/material.
      x-ngsi:
        type: Property

    name:
      allOf:
        - additionalProperties: no
          properties:
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Property
              type: string
            value:
              type: string
          required:
            - type
            - value
          type: object
      description: Human-readable name of the product model, used to label products. Given in the source as https://schema.org/name.
      x-ngsi:
        type: Property

    quantityUnit:
      allOf:
        - additionalProperties: no
          properties:
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Property
              type: string
            value:
              type: string
          required:
            - type
            - value
          type: object
      description: UN/CEFACT code of the default unit of measurement for products of this model, e.g. KGM (kilogram), KWH (kilowatt hour) or EA (each).
      x-ngsi:
        type: Property

    refLcaId:
      allOf:
        - additionalProperties: no
          properties:
            observedAt:
              format: date-time
              type: string
            type:
              enum:
                - Property
              type: string
            value:
              type: string
          required:
            - type
            - value
          type: object
      description: Reference identifier used for LCA traceability.
      x-ngsi:
        type: Property

    type:
      description: NGSI Entity type. It has to be ProductModel
      enum:
        - ProductModel
      type: string
      x-ngsi:
        type: Property

  required:
    - id
    - type
    - name
    - quantityUnit
    - material

  type: object

