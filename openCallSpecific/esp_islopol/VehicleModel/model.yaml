VehicleModel:

  description: CIRCULOOS data model for a vehicle model in the ISLOPOL value chain, grouping the technical characteristics shared by vehicles of that model, including brand, fuel type, cargo volume and weight.

  properties:

    brandName:
      allOf:
        - anyOf:
            - type: string
            - additionalProperties: no
              properties:
                observedAt:
                  format: date-time
                  type: string
                type:
                  enum:
                    - Property
                  type: string
                value:
                  type: string
              required:
                - type
                - value
              type: object
      description: Brand or marque of the vehicle model.
      x-ngsi:
        type: Property

    cargoVolume:

      allOf:
        - anyOf:

            - anyOf:
                - description: Exact measured value, when a single figure is known.
                  type: number
                - additionalProperties: no
                  minProperties: 1
                  properties:
                    maxValue:
                      description: Upper bound of the value, when the source declares a range or a maximum.
                      type: number
                    minValue:
                      description: Lower bound of the value, when the source declares a range or a minimum.
                      type: number
                  type: object
              description: Exact value as a number, or a range as an object with minValue and/or maxValue.

            - additionalProperties: no
              properties:
                observedAt:
                  format: date-time
                  type: string
                type:
                  enum:
                    - Property
                  type: string
                unitCode:
                  description: Unit of measurement of the value, given as a UN/CEFACT code where one exists.
                  type: string
                value:
                  anyOf:
                    - description: Exact measured value, when a single figure is known.
                      type: number
                    - additionalProperties: no
                      minProperties: 1
                      properties:
                        maxValue:
                          description: Upper bound of the value, when the source declares a range or a maximum.
                          type: number
                        minValue:
                          description: Lower bound of the value, when the source declares a range or a minimum.
                          type: number
                      type: object
                  description: Exact value as a number, or a range as an object with minValue and/or maxValue.
              required:
                - type
                - unitCode
                - value
              type: object

      description: 'Expected unitCode: LTR. Cargo volume specified for the vehicle model.'

      x-ngsi:
        type: Property

    fuelType:

      allOf:
        - anyOf:

            - enum:
                - autogas
                - biodiesel
                - cng
                - diesel
                - electric
                - ethanol
                - gasoline
                - hybrid_electric_diesel
                - hybrid_electric_petrol
                - hydrogen
                - lpg
                - petrol
                - petrol(unleaded)
                - petrol(leaded)
                - other
              type: string

            - additionalProperties: no
              properties:
                observedAt:
                  format: date-time
                  type: string
                type:
                  enum:
                    - Property
                  type: string
                value:
                  enum:
                    - autogas
                    - biodiesel
                    - cng
                    - diesel
                    - electric
                    - ethanol
                    - gasoline
                    - hybrid_electric_diesel
                    - hybrid_electric_petrol
                    - hydrogen
                    - lpg
                    - petrol
                    - petrol(unleaded)
                    - petrol(leaded)
                    - other
                  type: string
              required:
                - type
                - value
              type: object

      description: Fuel or energy type used by vehicles of this model. Given in the source as https://schema.org/fuelType.

      x-ngsi:
        type: Property

    id:
      description: ''
      type: string
      x-ngsi:
        model: Unique entity identifier, with the format urn:ngsi-ld:Vehicle<brand>_<model>.
        type: Property

    modelName:
      allOf:
        - anyOf:
            - type: string
            - additionalProperties: no
              properties:
                observedAt:
                  format: date-time
                  type: string
                type:
                  enum:
                    - Property
                  type: string
                value:
                  type: string
              required:
                - type
                - value
              type: object
      description: Manufacturer's model designation.
      x-ngsi:
        type: Property

    name:
      allOf:
        - anyOf:
            - type: string
            - additionalProperties: no
              properties:
                observedAt:
                  format: date-time
                  type: string
                type:
                  enum:
                    - Property
                  type: string
                value:
                  type: string
              required:
                - type
                - value
              type: object
      description: Human-readable name of the vehicle model, typically combining the brand and model designation. Given in the source as https://schema.org/name.
      x-ngsi:
        type: Property

    type:
      description: NGSI Entity type. It has to be VehicleModel
      enum:
        - VehicleModel
      type: string
      x-ngsi:
        type: Property

    weight:

      allOf:
        - anyOf:

            - anyOf:
                - description: Exact measured value, when a single figure is known.
                  type: number
                - additionalProperties: no
                  minProperties: 1
                  properties:
                    maxValue:
                      description: Upper bound of the value, when the source declares a range or a maximum.
                      type: number
                    minValue:
                      description: Lower bound of the value, when the source declares a range or a minimum.
                      type: number
                  type: object
              description: Exact value as a number, or a range as an object with minValue and/or maxValue.

            - additionalProperties: no
              properties:
                observedAt:
                  format: date-time
                  type: string
                type:
                  enum:
                    - Property
                  type: string
                unitCode:
                  description: Unit of measurement of the value, given as a UN/CEFACT code where one exists.
                  type: string
                value:
                  anyOf:
                    - description: Exact measured value, when a single figure is known.
                      type: number
                    - additionalProperties: no
                      minProperties: 1
                      properties:
                        maxValue:
                          description: Upper bound of the value, when the source declares a range or a maximum.
                          type: number
                        minValue:
                          description: Lower bound of the value, when the source declares a range or a minimum.
                          type: number
                      type: object
                  description: Exact value as a number, or a range as an object with minValue and/or maxValue.
              required:
                - type
                - unitCode
                - value
              type: object

      description: 'Expected unitCode: KGM. Vehicle weight recorded for the model. Given in the source as https://schema.org/weight.'

      x-ngsi:
        type: Property

  required:
    - id
    - type

  type: object

